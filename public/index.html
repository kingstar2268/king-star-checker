<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KING STAR CHECKER</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at top, #401010, #09090d 65%);
      color: white; font-family: Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 440px; padding: 26px;
      border: 1px solid #743333; border-radius: 24px;
      background: #100d13eF; box-shadow: 0 0 35px #8b101033;
    }
    h1 { text-align: center; letter-spacing: 3px; }
    h1 span { color: #ff4141; }
    p { color: #bcb4c1; text-align: center; }
    label { display: block; margin: 24px 0 8px; }
    input, button {
      width: 100%; padding: 15px; border-radius: 12px;
      font-size: 16px;
    }
    input {
      background: #09070d; border: 1px solid #624078;
      color: white; outline: none;
    }
    button {
      margin-top: 16px; border: 0; color: white;
      background: linear-gradient(90deg, #a20e21, #ed303b);
      font-weight: bold;
    }
    #result {
      display: none; margin-top: 20px; padding: 16px;
      border-radius: 12px; background: #21171d;
      overflow-wrap: anywhere;
    }
    small { color: #bcb4c1; }
  </style>
</head>
<body>
  <main>
    <h1>👑 KING <span>STAR</span></h1>
    <p>NUMBER CHECKER</p>
    <label for="phone">Phone number with country code</label>
    <input id="phone" type="tel" placeholder="+2547XXXXXXXX">
    <button id="check">CHECK</button>
    <div id="result" role="status"></div>
    <p><small>Demo checker — no real WhatsApp ban data is accessed.</small></p>
  </main>
  <script>
    const input = document.getElementById('phone');
    const result = document.getElementById('result');

    document.getElementById('check').onclick = () => {
      const phone = input.value.trim().replace(/[\s()-]/g, '');
      result.style.display = 'block';
      result.style.whiteSpace = 'pre-line';

      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        result.textContent = '❌ Invalid number format. Example: +254712345678';
        return;
      }

      result.textContent =
        '👑 KING STAR CHECKER\n\n' +
        '📱 Phone Number: ' + phone + '\n' +
        '🔎 Number Format: Valid\n' +
        '🛡️ WhatsApp Ban Status: Not available\n' +
        '📋 Violation: Cannot be verified\n' +
        '📨 Appeal: Contact official WhatsApp support\n\n' +
        '⚠️ This tool checks number format only. It cannot access WhatsApp ban records.';
    };
  </script>

  <section id="king-chat" style="max-width:500px;margin:28px auto;padding:18px;background:#151515;color:white;border:1px solid #b22222;border-radius:14px;font-family:Arial,sans-serif;">
    <h2 style="color:#ff3333;margin-top:0;">KING STAR BOT</h2>
    <div id="chat-messages" style="height:180px;overflow-y:auto;background:#080808;padding:12px;border-radius:8px;margin-bottom:12px;">Bot: Karibu KING STAR! Nikusaidie nini?</div>
    <form id="chat-form" style="display:flex;gap:8px;">
      <input id="chat-input" placeholder="Andika ujumbe..." autocomplete="off" style="min-width:0;flex:1;padding:11px;border-radius:7px;border:1px solid #555;">
      <button type="submit" style="background:#c00000;color:white;border:0;border-radius:7px;padding:10px;">TUMA</button>
    </form>
  </section>
  <script>
    document.getElementById('chat-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const input = document.getElementById('chat-input');
      const messages = document.getElementById('chat-messages');
      const message = input.value.trim();
      if (!message) return;

      const userLine = document.createElement('p');
      userLine.textContent = 'Wewe: ' + message;
      messages.appendChild(userLine);
      input.value = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        const botLine = document.createElement('p');
        botLine.textContent = 'KING STAR BOT: ' + (data.reply || 'Samahani, jaribu tena.');
        messages.appendChild(botLine);
      } catch (error) {
        const botLine = document.createElement('p');
        botLine.textContent = 'Bot haipatikani kwa sasa. Jaribu tena.';
        messages.appendChild(botLine);
      }
      messages.scrollTop = messages.scrollHeight;
    });
  </script>

</body>
</html>
